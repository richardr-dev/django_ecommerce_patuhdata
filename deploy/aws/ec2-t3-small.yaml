AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lakuin on one EC2 t3.small: Ubuntu 24.04 with Docker, an Elastic IP, ports 80/443 open
  for Caddy, Session Manager access, daily EBS snapshots, one S3 bucket for uploaded images
  (media/, public) and backups (backups/, private), automatic recovery and alarms. The app itself runs from
  compose.prod.yaml (see docs/DEPLOY_AWS.md).

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large]
  VolumeSizeGiB:
    Type: Number
    Default: 30
    MinValue: 20
    Description: Root disk for the OS, Docker images, PostgreSQL data, media and local backups.
  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair for SSH. Leave empty to connect with Session Manager only.
  SshCidr:
    Type: String
    Default: ""
    Description: Optional IP range allowed to SSH, e.g. 203.0.113.10/32. Empty keeps port 22 closed.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional Route 53 hosted zone for PlatformDomain. Empty means you add the DNS records yourself.
  PlatformDomain:
    Type: String
    Default: lakuin.store
  SnapshotRetainDays:
    Type: Number
    Default: 7
    MinValue: 1
  OffsiteBackupDays:
    Type: Number
    Default: 30
    MinValue: 7
    Description: Days the bucket keeps each backup under backups/.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional address for alarms (server down, CPU, disk full, stale backup). AWS emails a confirmation link first.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Conditions:
  HasKey: !Not [!Equals [!Ref KeyName, ""]]
  HasSsh: !Not [!Equals [!Ref SshCidr, ""]]
  HasZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lakuin web (Caddy) and optional SSH
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP (ACME + redirect)}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS}
        - {IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTP/3}
        - !If
          - HasSsh
          - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SshCidr, Description: SSH}
          - !Ref AWS::NoValue

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: sts:AssumeRole}
      # Session Manager shell in the console: no open SSH port or key needed.
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Policies:
        - PolicyName: storage-and-alerts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Images: the app writes, reads and deletes under media/ only.
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub "${StorageBucket.Arn}/media/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StorageBucket.Arn
                Condition: {StringLike: {"s3:prefix": ["media/*"]}}
              # Backups: upload only. A compromised server cannot delete or overwrite past
              # backups, because the bucket keeps every version.
              - {Effect: Allow, Action: s3:PutObject, Resource: !Sub "${StorageBucket.Arn}/backups/*"}
              - {Effect: Allow, Action: sns:Publish, Resource: !Ref AlertTopic}

  # The platform's one bucket: media/ holds sellers' images (public read, per-store folders),
  # backups/ holds database and image backups (private, expire after OffsiteBackupDays).
  StorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "lakuin-storage-${AWS::AccountId}"
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      # ACLs stay blocked; only the bucket policy below makes media/ readable.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-backups
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: !Ref OffsiteBackupDays
          - Id: tidy-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 7}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
      Tags: [{Key: Name, Value: lakuin-storage}]

  StorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StorageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicImages
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${StorageBucket.Arn}/media/*"
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt StorageBucket.Arn, !Sub "${StorageBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Lakuin alerts
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Server:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKey, !Ref KeyName, !Ref AWS::NoValue]
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      DisableApiTermination: true
      PropagateTagsToVolumeOnCreation: true
      # Hop limit 2: the app runs in a container, one network hop further from the instance
      # role's credentials.
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 2}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSizeGiB
            Encrypted: true
            # The disk holds the database; keep it if the instance is ever terminated.
            DeleteOnTermination: false
      Tags:
        - {Key: Name, Value: lakuin-web}
        - {Key: lakuin-backup, Value: daily}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # 2 GiB swap: building the image on 2 GiB RAM can otherwise run out of memory.
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          echo 'vm.swappiness=10' > /etc/sysctl.d/99-swap.conf && sysctl --system

          apt-get update
          apt-get install -y ca-certificates curl git unattended-upgrades
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

          # Rotate container logs so they cannot fill the disk.
          cat > /etc/docker/daemon.json <<'JSON'
          {"log-driver": "local", "log-opts": {"max-size": "20m", "max-file": "5"}}
          JSON
          systemctl enable --now docker
          systemctl restart docker
          usermod -aG docker ubuntu
          touch /var/lib/cloud/lakuin-bootstrap-done

  # AWS hardware or network fault: move the instance to healthy hardware, keeping its disk,
  # Elastic IP and instance ID.
  RecoverAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lakuin server failed the AWS system check; recovering it.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{Name: InstanceId, Value: !Ref Server}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Sub "arn:aws:automate:${AWS::Region}:ec2:recover", !Ref AlertTopic]
  # The operating system stopped responding (e.g. out of memory): reboot it.
  RebootAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lakuin server failed the instance check; rebooting it.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_Instance
      Dimensions: [{Name: InstanceId, Value: !Ref Server}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Sub "arn:aws:automate:${AWS::Region}:ec2:reboot", !Ref AlertTopic]
  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lakuin server CPU above 85% for 15 minutes; time for a bigger instance?
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref Server}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ServerIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Server
      Tags: [{Key: Name, Value: lakuin-web}]

  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: dlm.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole]

  DailySnapshots:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Daily snapshot of the Lakuin server disk
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        ResourceTypes: [VOLUME]
        TargetTags: [{Key: lakuin-backup, Value: daily}]
        Schedules:
          - Name: daily
            CreateRule: {Interval: 24, IntervalUnit: HOURS, Times: ["19:00"]}  # 02:00 WIB
            RetainRule: {Count: !Ref SnapshotRetainDays}
            CopyTags: true

  ApexRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref PlatformDomain
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ServerIp]
  WwwRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub www.${PlatformDomain}
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ServerIp]
  StoresRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "*.${PlatformDomain}"
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ServerIp]

Outputs:
  PublicIp:
    Description: Point lakuin.store, www.lakuin.store and *.lakuin.store (A records) here.
    Value: !Ref ServerIp
  InstanceId:
    Value: !Ref Server
  StorageBucketName:
    Description: Images under media/ (USE_S3=1, AWS_STORAGE_BUCKET_NAME) and backups under backups/.
    Value: !Ref StorageBucket
  AlertTopicArn:
    Value: !Ref AlertTopic
  Connect:
    Description: Shell without SSH (needs the AWS CLI with the Session Manager plugin).
    Value: !Sub aws ssm start-session --region ${AWS::Region} --target ${Server}
