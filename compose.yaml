services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload"
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://commerce:commerce@db:5432/commerce
    volumes: [".:/app"]
    depends_on: {db: {condition: service_healthy}}
  worker:
    build: .
    command: python manage.py process_outbox --loop
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://commerce:commerce@db:5432/commerce
    depends_on: {db: {condition: service_healthy}}
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: commerce, POSTGRES_USER: commerce, POSTGRES_PASSWORD: commerce}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U commerce"], interval: 3s, timeout: 3s, retries: 10}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes: {postgres_data: {}}
