# Local development: live code reload, demo data on first start, PostgreSQL on localhost:5433.
#   docker compose up --build        then open http://localhost:8000
# Production lives in compose.prod.yaml.
x-app: &app
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql://commerce:commerce@db:5432/commerce
    CACHE_BACKEND: db
  # Same live code in web and worker; without the mount they run whatever the image was built with.
  volumes: [".:/app"]
  depends_on: {db: {condition: service_healthy}}

services:
  web:
    <<: *app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload --access-logfile -
    ports: ["8000:8000"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
      # Seeds only an empty database, so restarts never reset merchant edits.
      SEED_DEMO: "1"
  worker:
    <<: *app
    command: python manage.py process_outbox --loop
    # Start after web has migrated the database.
    depends_on: {web: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "docker/worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 30s
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:5433:5432"]
    environment: {POSTGRES_DB: commerce, POSTGRES_USER: commerce, POSTGRES_PASSWORD: commerce}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U commerce"], interval: 3s, timeout: 3s, retries: 10}
    volumes: ["postgres_data:/var/lib/postgresql/data"]

volumes: {postgres_data: {}}
