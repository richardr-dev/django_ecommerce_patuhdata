{% load static %}<link rel="stylesheet" href="{% static 'css/cart-recovery.css' %}"><form class="cart-recovery-box" method="post" action="{% url 'cart-recovery-opt-in' %}">{% csrf_token %}<h3>Ingatkan saya nanti</h3><p>Kami dapat mengirim satu email jika keranjang ini ditinggalkan.</p><div class="cart-recovery-fields"><input type="email" name="recovery_email" value="{% if recovery_session.recovery_email %}{{ recovery_session.recovery_email }}{% elif request.user.is_authenticated %}{{ request.user.email }}{% endif %}" placeholder="email@contoh.com" aria-label="Email pengingat"><button>Simpan pilihan</button></div><label class="cart-recovery-consent"><input type="checkbox" name="recovery_consent" {% if recovery_session.recovery_consent_at %}checked{% endif %}>Saya meminta satu pengingat keranjang melalui email. Pilihan ini dapat dinonaktifkan di sini.</label></form>
