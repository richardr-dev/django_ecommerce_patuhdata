<a class="pf-store" href="{{ item.url }}">{% if item.store.logo %}<img src="{{ item.store.logo.url }}" alt="" loading="lazy">{% else %}<span style="background:{{ item.store.primary_color }}">{{ item.store.name|slice:":1" }}</span>{% endif %}<div><strong>{{ item.store.name }}</strong>{% if item.store.description %}<p>{{ item.store.description|truncatechars:90 }}</p>{% endif %}</div></a>
