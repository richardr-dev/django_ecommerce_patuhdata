<div class="stk-reason{% if books_started %} stk-reason-pair{% endif %}">{% if books_started %}<label class="field"><span>Alasan</span><select name="reason_code">{% for key, r in stock_reasons.items %}<option value="{{ key }}"{% if key == chosen %} selected{% endif %}>{{ r.label }}</option>{% endfor %}</select></label><label class="field"><span>Keterangan</span><input name="reason" value="" placeholder="opsional"></label>{% else %}<label class="field"><span>Alasan</span><input name="reason" value="{{ note }}"></label>{% endif %}</div>
