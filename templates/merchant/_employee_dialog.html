{% load icons %}<dialog id="emp-{% if e %}{{ e.pk }}{% else %}new{% endif %}" class="pd-dialog" aria-labelledby="emp-title-{{ e.pk|default:'new' }}" style="max-width:640px"><form method="post" data-unsaved>{% csrf_token %}{% if e %}<input type="hidden" name="employee_id" value="{{ e.pk }}">{% endif %}
  <header><h2 id="emp-title-{{ e.pk|default:'new' }}">{% if e %}Ubah {{ e.name }}{% else %}Tambah karyawan{% endif %}</h2><button type="button" data-close aria-label="Tutup">&times;</button></header><div>
    <div class="field-row"><label class="field"><span>Nama</span><input name="name" maxlength="120" required value="{% if e %}{{ e.name }}{% else %}{{ post.name }}{% endif %}"></label>
      <label class="field"><span>Jabatan</span><input name="position" maxlength="80" value="{% if e %}{{ e.position }}{% else %}{{ post.position }}{% endif %}"></label></div>
    <div class="field-row"><label class="field"><span>NIK</span><input name="nik" inputmode="numeric" maxlength="16" value="{% if e %}{{ e.nik }}{% else %}{{ post.nik }}{% endif %}"></label>
      <label class="field"><span>NPWP</span><input name="npwp" inputmode="numeric" maxlength="20" value="{% if e %}{{ e.npwp }}{% else %}{{ post.npwp }}{% endif %}"></label></div>
    <div class="field-row"><label class="field"><span>Status PTKP</span><select name="ptkp_status">{% for code, label in ptkp %}<option value="{{ code }}"{% if e and e.ptkp_status == code %} selected{% elif not e and post.ptkp_status == code %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
      <label class="field"><span>Mulai bekerja</span><input type="date" name="joined_on" value="{% if e %}{{ e.joined_on|date:'Y-m-d' }}{% else %}{{ post.joined_on }}{% endif %}"></label></div>
    <div class="field-row"><label class="field"><span>Berhenti bekerja</span><input type="date" name="left_on" value="{% if e %}{{ e.left_on|date:'Y-m-d' }}{% else %}{{ post.left_on }}{% endif %}"><small style="color:var(--ds-muted)">Bulan ini menjadi masa pajak terakhir: PPh 21 dihitung ulang setahun</small></label>
      <span></span></div>
    <div class="field-row"><label class="field"><span>Gaji pokok</span><input name="base_salary" data-rupiah inputmode="numeric" value="{% if e %}{{ e.base_salary|floatformat:'0' }}{% else %}{{ post.base_salary }}{% endif %}"></label>
      <label class="field"><span>Tunjangan tetap</span><input name="allowance" data-rupiah inputmode="numeric" value="{% if e %}{{ e.allowance|floatformat:'0' }}{% else %}{{ post.allowance }}{% endif %}"></label></div>
    <div class="field-row"><label class="field"><span>Tarif PPh 21 manual (%)</span><input name="pph21_rate" inputmode="decimal" placeholder="otomatis (TER)" value="{% if e %}{% if e.pph21_rate != None %}{{ e.pph21_rate|floatformat:'-2' }}{% endif %}{% else %}{{ post.pph21_rate }}{% endif %}"><small style="color:var(--ds-muted)">Kosongkan: otomatis dari tabel TER</small></label>
      <label class="field"><span>Rekening gaji</span><input name="bank_account_number" maxlength="40" placeholder="Bank · nomor" value="{% if e %}{{ e.bank_account_number }}{% else %}{{ post.bank_account_number }}{% endif %}"></label></div>
    <input type="hidden" name="bank_name" value="{% if e %}{{ e.bank_name }}{% endif %}">
    <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="bpjs" value="1"{% if e %}{% if e.bpjs %} checked{% endif %}{% elif not post or post.bpjs %} checked{% endif %} style="width:16px;height:16px;accent-color:var(--ds-primary)"> Ikut BPJS Kesehatan dan Ketenagakerjaan</label>
    <label style="display:flex;align-items:center;gap:8px"><input type="hidden" name="is_active" value="0"><input type="checkbox" name="is_active" value="1"{% if not e or e.is_active %} checked{% endif %} style="width:16px;height:16px;accent-color:var(--ds-primary)"> Aktif (masuk penggajian)</label>
  </div>
  <footer><button type="button" class="btn" data-close>Batal</button><button class="btn-primary">{% icon "check" %} Simpan</button></footer></form></dialog>
