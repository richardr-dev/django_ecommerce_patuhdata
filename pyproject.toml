[project]
name = "niagakit"
version = "0.1.0"
description = "Multi-tenant commerce platform for Indonesian merchants"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "dj-database-url>=2.2,<3",
  "django-storages[s3]>=1.14,<2",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "sentry-sdk[django]>=2.40,<3",
  "whitenoise>=6.8,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-django>=4.9,<5", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "**/migrations/*.py"]

[tool.ruff.lint]
ignore = ["RUF012"]
